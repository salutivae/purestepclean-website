<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Pure Step Clean provides premium residential, Airbnb, commercial cleaning, organization, property support, and small repair services."
  >

  <meta name="theme-color" content="#071f45">

  <title>Pure Step Clean | Premium Cleaning & Property Care</title>

  <style>
    :root {
      --navy: #071f45;
      --navy-soft: #123a68;
      --teal: #02aaa7;
      --aqua: #25c9c1;
      --purple: #7656d9;
      --coral: #ff6868;
      --green: #08a660;
      --white: #ffffff;
      --off-white: #fbfaf8;
      --light: #f2f7f7;
      --text: #17313d;
      --muted: #60737b;
      --border: rgba(7, 31, 69, 0.12);
      --shadow: 0 24px 70px rgba(7, 31, 69, 0.12);
      --radius-large: 30px;
      --radius-medium: 20px;
      --radius-small: 13px;
      --container: 1180px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      overflow-x: hidden;
      color: var(--text);
      background: var(--white);
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      line-height: 1.6;
    }

    body.menu-open {
      overflow: hidden;
    }

    img {
      display: block;
      max-width: 100%;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1,
    h2,
    h3 {
      color: var(--navy);
      line-height: 1.08;
      letter-spacing: -0.04em;
    }

    h1 {
      margin-bottom: 24px;
      font-size: clamp(3rem, 7vw, 6.3rem);
    }

    h2 {
      margin-bottom: 20px;
      font-size: clamp(2.2rem, 4.5vw, 4.2rem);
    }

    h3 {
      margin-bottom: 10px;
      font-size: 1.35rem;
    }

    section {
      padding: 105px 0;
    }

    .container {
      width: min(calc(100% - 36px), var(--container));
      margin: 0 auto;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      color: var(--teal);
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 30px;
      height: 2px;
      border-radius: 999px;
      background: var(--teal);
    }

    .lead {
      max-width: 720px;
      color: var(--muted);
      font-size: clamp(1.04rem, 1.8vw, 1.25rem);
    }

    .button {
      display: inline-flex;
      min-height: 52px;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 0 23px;
      border: 1px solid transparent;
      border-radius: 999px;
      font-weight: 850;
      transition:
        transform 180ms ease,
        background 180ms ease,
        box-shadow 180ms ease;
    }

    .button:hover {
      transform: translateY(-2px);
    }

    .button-primary {
      color: var(--white);
      background: linear-gradient(135deg, var(--navy), var(--teal));
      box-shadow: 0 16px 40px rgba(2, 170, 167, 0.23);
    }

    .button-primary:hover {
      box-shadow: 0 19px 46px rgba(2, 170, 167, 0.32);
    }

    .button-secondary {
      border-color: var(--border);
      color: var(--navy);
      background: rgba(255, 255, 255, 0.86);
    }

    .button-light {
      color: var(--navy);
      background: var(--white);
    }

    .header {
      position: fixed;
      z-index: 1000;
      top: 0;
      right: 0;
      left: 0;
      border-bottom: 1px solid rgba(7, 31, 69, 0.08);
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(18px);
    }

    .navigation {
      display: flex;
      min-height: 82px;
      align-items: center;
      justify-content: space-between;
      gap: 26px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .brand img {
      width: 68px;
      height: 68px;
      object-fit: contain;
    }

    .brand-text {
      line-height: 1;
    }

    .brand-name {
      display: block;
      color: var(--navy);
      font-size: 1.18rem;
      font-weight: 900;
      letter-spacing: -0.04em;
    }

    .brand-subtitle {
      display: block;
      margin-top: 5px;
      color: var(--teal);
      font-size: 0.62rem;
      font-weight: 900;
      letter-spacing: 0.19em;
      text-transform: uppercase;
    }

    .navigation-links {
      display: flex;
      align-items: center;
      gap: 24px;
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 750;
    }

    .navigation-links > a:not(.button):hover {
      color: var(--teal);
    }

    .menu-button {
      display: none;
      width: 46px;
      height: 46px;
      border: 1px solid var(--border);
      border-radius: 50%;
      color: var(--navy);
      background: var(--white);
    }

    .hero {
      position: relative;
      min-height: 900px;
      padding: 165px 0 100px;
      overflow: hidden;
      background:
        radial-gradient(
          circle at 87% 20%,
          rgba(2, 170, 167, 0.23),
          transparent 28%
        ),
        radial-gradient(
          circle at 10% 80%,
          rgba(118, 86, 217, 0.11),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #ffffff 0%,
          #eff9f8 52%,
          #fff7f4 100%
        );
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.04fr 0.96fr;
      align-items: center;
      gap: 60px;
    }

    .hero-copy {
      position: relative;
      z-index: 2;
    }

    .hero-copy strong {
      color: var(--teal);
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin: 34px 0 38px;
    }

    .hero-features {
      display: flex;
      flex-wrap: wrap;
      gap: 18px 25px;
      color: var(--muted);
      font-size: 0.91rem;
      font-weight: 750;
    }

    .hero-features span {
      display: inline-flex;
      align-items: center;
      gap: 9px;
    }

    .hero-features span::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 0 5px rgba(2, 170, 167, 0.13);
    }

    .hero-visual {
      position: relative;
      min-height: 620px;
    }

    .hero-image {
      position: absolute;
      inset: 65px 0 0 45px;
      border-radius: 42px;
      background:
        linear-gradient(
          180deg,
          rgba(7, 31, 69, 0),
          rgba(7, 31, 69, 0.36)
        ),
        url("https://images.unsplash.com/photo-1581578731548-c64695cc6952?auto=format&fit=crop&w=1400&q=88")
        center / cover;
      box-shadow: var(--shadow);
    }

    .hero-logo-card {
      position: absolute;
      z-index: 3;
      top: 0;
      right: 12px;
      width: min(300px, 72%);
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.85);
      border-radius: 25px;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 20px 50px rgba(7, 31, 69, 0.14);
      backdrop-filter: blur(16px);
    }

    .hero-logo-card img {
      width: 100%;
      max-height: 260px;
      object-fit: contain;
    }

    .hero-report-card {
      position: absolute;
      z-index: 3;
      bottom: 15px;
      left: 0;
      width: min(320px, 80%);
      padding: 22px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 20px 50px rgba(7, 31, 69, 0.14);
    }

    .hero-report-card small {
      display: block;
      margin-bottom: 7px;
      color: var(--teal);
      font-size: 0.73rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .hero-report-card strong {
      display: block;
      color: var(--navy);
      font-size: 1.18rem;
      line-height: 1.3;
    }

    .trust-wrapper {
      position: relative;
      z-index: 10;
      margin-top: -45px;
    }

    .trust-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius-large);
      background: var(--white);
      box-shadow: var(--shadow);
    }

    .trust-item {
      padding: 27px;
      border-right: 1px solid var(--border);
    }

    .trust-item:last-child {
      border-right: 0;
    }

    .trust-item strong {
      display: block;
      margin-bottom: 5px;
      color: var(--navy);
    }

    .trust-item span {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 40px;
      margin-bottom: 45px;
    }

    .section-heading .lead {
      max-width: 525px;
    }

    .services {
      background: var(--white);
    }

    .service-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 28px;
    }

    .service-tab {
      padding: 12px 18px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      background: var(--white);
      font-weight: 850;
    }

    .service-tab.active {
      border-color: var(--navy);
      color: var(--white);
      background: linear-gradient(135deg, var(--navy), var(--teal));
    }

    .service-panel {
      display: none;
      grid-template-columns: 0.84fr 1.16fr;
      gap: 38px;
      padding: 36px;
      border: 1px solid var(--border);
      border-radius: var(--radius-large);
      background: var(--light);
    }

    .service-panel.active {
      display: grid;
    }

    .service-introduction {
      padding: 16px;
    }

    .service-introduction p {
      color: var(--muted);
    }

    .service-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .service-card {
      padding: 22px;
      border: 1px solid rgba(7, 31, 69, 0.09);
      border-radius: var(--radius-medium);
      background: var(--white);
      transition:
        transform 180ms ease,
        box-shadow 180ms ease;
    }

    .service-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 36px rgba(7, 31, 69, 0.09);
    }

    .service-number {
      display: grid;
      width: 43px;
      height: 43px;
      place-items: center;
      margin-bottom: 15px;
      border-radius: 13px;
      color: var(--navy);
      background:
        linear-gradient(
          135deg,
          rgba(2, 170, 167, 0.19),
          rgba(118, 86, 217, 0.13)
        );
      font-weight: 900;
    }

    .service-card p {
      margin-bottom: 0;
      color: var(--muted);
      font-size: 0.93rem;
    }

    .standards {
      color: var(--white);
      background:
        linear-gradient(
          135deg,
          rgba(7, 31, 69, 0.98),
          rgba(0, 100, 111, 0.96)
        );
    }

    .standards h2,
    .standards h3 {
      color: var(--white);
    }

    .standards .eyebrow {
      color: var(--aqua);
    }

    .standards .lead {
      color: rgba(255, 255, 255, 0.72);
    }

    .standards-grid {
      display: grid;
      grid-template-columns: 0.9fr 1.1fr;
      align-items: center;
      gap: 65px;
    }

    .standard-list {
      display: grid;
      gap: 14px;
    }

    .standard-item {
      display: grid;
      grid-template-columns: 48px 1fr;
      gap: 16px;
      padding: 18px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: var(--radius-medium);
      background: rgba(255, 255, 255, 0.07);
    }

    .standard-icon {
      display: grid;
      height: 48px;
      place-items: center;
      border-radius: 14px;
      color: var(--navy);
      background: linear-gradient(135deg, var(--aqua), #8be3d6);
      font-weight: 900;
    }

    .standard-item p {
      margin-bottom: 0;
      color: rgba(255, 255, 255, 0.69);
      font-size: 0.91rem;
    }

    .plans {
      background: var(--off-white);
    }

    .plan-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .plan-card {
      position: relative;
      padding: 30px;
      border: 1px solid var(--border);
      border-radius: var(--radius-large);
      background: var(--white);
    }

    .plan-card.featured {
      color: var(--white);
      background: linear-gradient(150deg, var(--navy), #006f78);
      box-shadow: var(--shadow);
      transform: translateY(-12px);
    }

    .plan-card.featured h3 {
      color: var(--white);
    }

    .plan-badge {
      position: absolute;
      top: 18px;
      right: 18px;
      padding: 6px 10px;
      border-radius: 999px;
      color: var(--navy);
      background: var(--aqua);
